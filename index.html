<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#315e83"><title>Everyday English Lab</title><style>
*{box-sizing:border-box}body{margin:0;background:#f4f7fb;color:#183047;font-family:system-ui,-apple-system,sans-serif}header{background:#315e83;color:white;padding:24px 18px}header h1{margin:0;font-size:23px}header p{opacity:.85;margin:7px 0 0}.wrap{max-width:650px;margin:auto;padding:16px}.card{background:white;border-radius:18px;padding:20px;margin:12px 0;box-shadow:0 2px 10px #14314c0d}h2{margin:0 0 12px;font-size:19px}p{line-height:1.6}.muted{color:#617386;font-size:14px}.tag{display:inline-block;background:#e8f2ff;color:#315e83;border-radius:30px;padding:5px 10px;font-size:12px}button,select,textarea{font:inherit}button{border:0;border-radius:12px;background:#315e83;color:white;padding:13px 16px;cursor:pointer}button:disabled{opacity:.5}button.alt{background:#eaf0f7;color:#315e83}button.choice{display:block;width:100%;margin:8px 0;text-align:left;background:#edf3f9;color:#183047}button.choice.selected{background:#cbdff3}nav{display:flex;gap:6px;position:sticky;bottom:0;background:#fff;padding:10px;box-shadow:0 -2px 12px #0001}nav button{flex:1;font-size:12px;padding:11px 4px}textarea{width:100%;min-height:95px;padding:12px;border:1px solid #cbd7e5;border-radius:12px}progress{width:100%;height:13px}ul{padding-left:22px}li{margin:8px 0}.answer{background:#eaf7ee;border-radius:12px;padding:12px;margin-top:12px;white-space:pre-wrap}.hidden{display:none}.row{display:flex;gap:8px;flex-wrap:wrap}small{color:#617386}
</style></head><body><header><h1>Everyday English Lab</h1><p>매일 20분, 문법에서 실전 회화까지</p></header><main class="wrap" id="app"></main><nav><button onclick="home()">홈</button><button onclick="lesson()">학습</button><button onclick="review()">복습</button><button onclick="stats()">기록</button></nav>
<script>
const units=[
["현재형","일상과 습관","I usually spend time alone after work.","I usually ___ time alone after work.",["spend","spent","spending"],0,"I usually spend time alone after work.","나는 퇴근 후 보통 혼자 시간을 보낸다."],
["과거형","지난 경험","I visited Italy several years ago.","I ___ Italy several years ago.",["visit","visited","visiting"],1,"I visited Italy several years ago.","나는 몇 년 전에 이탈리아를 방문했다."],
["미래 표현","계획 이야기","I'm going to practice English every day.","I'm going to ___ English every day.",["practiced","practice","practicing"],1,"I'm going to practice English every day.","나는 매일 영어를 연습할 예정이다."],
["현재완료","경험 말하기","I've been to Germany before.","I ___ been to Germany before.",["have","am","was"],0,"I've been to Germany before.","나는 전에 독일에 가본 적이 있다."],
["조동사","조언하기","You should take a short break.","You ___ take a short break.",["should","are","have"],0,"You should take a short break.","잠깐 쉬는 것이 좋겠다."],
["동명사","좋아하는 활동","I enjoy trying new experiences.","I enjoy ___ new experiences.",["try","trying","tried"],1,"I enjoy trying new experiences.","나는 새로운 경험을 해보는 것을 좋아한다."],
["to부정사","희망과 목표","I want to speak English fluently.","I want ___ English fluently.",["speak","to speak","speaking"],1,"I want to speak English fluently.","나는 영어를 유창하게 말하고 싶다."],
["비교 표현","선호 말하기","I'd rather travel with family than friends.","I'd rather ___ with family.",["travel","traveling","traveled"],0,"I'd rather travel with family than friends.","나는 친구보다 가족과 여행하고 싶다."],
["접속사","이유 설명","I stayed home because I was tired.","I stayed home ___ I was tired.",["but","because","although"],1,"I stayed home because I was tired.","피곤해서 집에 있었다."],
["전치사","시간과 장소","I usually get home at six.","I get home ___ six.",["in","on","at"],2,"I usually get home at six.","나는 보통 여섯 시에 집에 온다."],
["가정법","상상과 희망","If I had more time, I would travel more.","If I ___ more time, I would travel more.",["have","had","will have"],1,"If I had more time, I would travel more.","시간이 더 있다면 여행을 더 많이 할 텐데."],
["의문문","질문하기","What do you usually do on weekends?","What ___ you usually do on weekends?",["are","do","did"],1,"What do you usually do on weekends?","주말에 보통 무엇을 하나요?"]
];
const key="everyday-english-lab-v1";let saved;try{saved=JSON.parse(localStorage.getItem(key))||{}}catch(e){saved={}};let state={done:saved.done||{},wrong:saved.wrong||{},writing:saved.writing||{},current:saved.current||0};let index=state.current,stage=0,chosen=-1,shown=false;
const app=document.getElementById("app");function persist(){state.current=index;try{localStorage.setItem(key,JSON.stringify(state))}catch(e){}}function esc(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}function say(t){if(!("speechSynthesis" in window)){alert("이 브라우저에서는 음성 듣기를 지원하지 않습니다.");return}speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(t);u.lang="en-US";u.rate=.85;speechSynthesis.speak(u)}function box(s){app.innerHTML=s}function count(){return Object.keys(state.done).filter(k=>state.done[k]).length}
function home(){box('<div class="card"><span class="tag">오늘의 20분 영어</span><h2 style="margin-top:12px">Welcome back!</h2><p>문법 5분 · 표현 5분 · 영작 5분 · 회화 5분</p><progress max="12" value="'+count()+'"></progress><p class="muted">'+count()+' / 12개 주제 완료</p><button onclick="lesson()">오늘 학습 시작</button></div><div class="card"><h2>학습 주제</h2>'+units.map((u,i)=>'<p><button class="alt" onclick="start('+i+')">'+(state.done[i]?'✓ ':'')+'Day '+(i+1)+' · '+u[0]+' — '+u[1]+'</button></p>').join('')+'</div>')}
function start(i){index=i;stage=0;chosen=-1;shown=false;persist();lesson()}
function lesson(){let u=units[index];let content='';if(stage===0)content='<h2>① 문법 이해</h2><p>오늘의 문법: <b>'+u[0]+'</b></p><p>'+u[1]+'에 활용하는 문장입니다.</p><div class="answer">'+esc(u[2])+'</div><p>'+u[7]+'</p><button class="alt" onclick="say(units[index][2])">🔊 영어 듣기</button>';if(stage===1)content='<h2>② 표현 익히기</h2><p>문장을 소리 내어 세 번 따라 읽어 보세요.</p><div class="answer">'+esc(u[2])+'</div><button class="alt" onclick="say(units[index][2])">🔊 발음 듣기</button><p class="muted">문장 전체를 하나의 표현으로 익히면 회화에서 더 빠르게 말할 수 있어요.</p>';if(stage===2)content='<h2>③ 문법 퀴즈</h2><p>'+esc(u[3])+'</p>'+u[4].map((v,j)=>'<button class="choice '+(chosen===j?'selected':'')+'" onclick="pick('+j+')">'+(j+1)+'. '+esc(v)+'</button>').join('')+(chosen>=0?'<div class="answer">'+(chosen===u[5]?'정답입니다!':'다시 기억해 보세요. 정답: '+u[4][u[5]])+'</div>':'');if(stage===3)content='<h2>④ 영작 연습</h2><p>'+u[7]+'</p><textarea id="writing" placeholder="영어 문장을 직접 작성하세요">'+esc(state.writing[index]||'')+'</textarea><p><button class="alt" onclick="saveWriting()">작성 내용 저장</button> <button onclick="showAnswer()">모범 답안 확인</button></p>'+(shown?'<div class="answer">'+esc(u[6])+'</div><p class="muted">표현을 비교해 보세요. 자동 AI 첨삭은 제공하지 않습니다.</p>':'');if(stage===4)content='<h2>⑤ 실전 회화</h2><p>이 표현을 이용해 자신의 경험이나 생각을 영어로 말해 보세요.</p><p><b>'+esc(u[2])+'</b></p><button class="alt" onclick="say(units[index][2])">🔊 예문 듣기</button><p class="muted">자신의 이야기로 단어를 바꾸어 말해 보세요.</p>';box('<div class="card"><span class="tag">Day '+(index+1)+' / 12 · '+(stage+1)+'/5단계</span><progress max="5" value="'+(stage+1)+'"></progress>'+content+'<div class="row" style="margin-top:20px"><button class="alt" onclick="back()">이전</button><button onclick="next()">'+(stage===4?'학습 완료':'다음 단계')+'</button></div></div>')}
function pick(j){chosen=j;if(j!==units[index][5])state.wrong[index]=true;else delete state.wrong[index];persist();lesson()}function saveWriting(){state.writing[index]=document.getElementById("writing").value;persist();alert("이 기기에 저장했습니다.")}function showAnswer(){saveWriting();shown=true;lesson()}function back(){if(stage>0)stage--;else if(index>0){index--;stage=4}chosen=-1;shown=false;lesson()}function next(){if(stage===3){let el=document.getElementById("writing");if(el){state.writing[index]=el.value;persist()}}if(stage<4){stage++;chosen=-1;shown=false;lesson()}else{state.done[index]=true;persist();if(index<units.length-1)start(index+1);else stats()}}
function review(){let ids=Object.keys(state.wrong).filter(k=>state.wrong[k]);box('<div class="card"><h2>오답 복습</h2><p class="muted">틀린 문법 퀴즈를 다시 풀어 보세요.</p>'+(ids.length?ids.map(i=>'<p><button class="alt" onclick="startQuiz('+i+')">Day '+(+i+1)+' · '+units[i][0]+'</button></p>').join(''):'<p>현재 복습할 오답이 없습니다.</p>')+'</div>')}function startQuiz(i){index=+i;stage=2;chosen=-1;persist();lesson()}function resetData(){if(confirm('모든 기록을 삭제할까요?')){localStorage.removeItem(key);location.reload()}}function stats(){box('<div class="card"><h2>학습 기록</h2><p><b>'+count()+' / 12</b> 주제 완료</p><progress max="12" value="'+count()+'"></progress><p>복습할 주제: '+Object.keys(state.wrong).length+'개</p><p>저장된 영작: '+Object.keys(state.writing).filter(k=>state.writing[k].trim()).length+'개</p><p class="muted">기록은 현재 브라우저에만 저장됩니다. 브라우저 데이터를 삭제하거나 다른 기기로 이동하면 동기화되지 않습니다.</p><button class="alt" onclick="resetData()">학습 기록 초기화</button></div>')}home();
</script></body></html>
